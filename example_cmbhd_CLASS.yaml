### Example Cobaya input file for CMB-HD with CLASS
# NOTE: if you would like to modify these settings, please create a copy of this file to use.


## NOTE: indicate where the products will be written and a prefix for their name
##  see https://cobaya.readthedocs.io/en/latest/output.html#output-shell
output: hdlike_chains/cmbhd_CLASS

## this will automatically resume previously-run MCMC chains with the same
##  `output` path that you've provided above
resume: true

### Likelihood settings:
likelihood:
  hdlike.hdlike.HDLike:
    ## see `hdlike/HDLike.yaml` for a description of all settings
    ## NOTE: `delensed` must be `false` when using CLASS
    delensed: false
    baryonic_feedback: false
    ## To include DESI BAO data, un-comment the `bao.generic` block below.
  ## NOTE that you must provide the *absolute* path to the
  ##      `measurements_file` and `cov_file` below. Here, they are given
  ##      by their paths relative to the location of `example_cmbhd.yaml`.
  ##      Note that in the test python script `test_hdlike_cobaya.py`,
  ##      the absolute paths are found and passed to Cobaya.
  #bao.generic:
  #  measurements_file: hdlike/data/class_mock_desi_bao_rs_over_DV_data.txt
  #  cov_file: hdlike/data/mock_desi_bao_rs_over_DV_cov.txt

### CLASS settings: 
theory:
  classy:
    extra_args:
      N_ncdm: 3
      P_k_max_h/Mpc: 500
      T_cmb: 2.7255
      YHe: BBN
      accurate_lensing: 1
      deg_ncdm: 1,1,1
      delta_l_max: 2050
      ## NOTE: If `baryonic_feedback` is `True` in the `hdlike.hdlike.HDLike`
      ##       block above, set `hmcode_version: 2020_baryonic_feedback`
      hmcode_version: 2016
      hyper_flat_approximation_nu: 7000.0
      hyper_sampling_flat: 32.0
      l_linstep: 20
      l_logstep: 1.025
      l_max_g: 40
      l_max_ncdm: 30
      l_max_pol_g: 60
      l_max_scalars: 24500
      l_max_ur: 35
      l_switch_limber: 30.0
      lensing: 'yes'
      modes: s
      non_linear: hmcode
      output: lCl,tCl,pCl,mPk
      perturbations_sampling_stepsize: 0.05
      radiation_streaming_approximation: 2
      radiation_streaming_trigger_tau_over_tau_k: 240.0
      recombination: recfast
      sBBN file: /external/bbn/PRIMAT_Yp_DH_ErrorMC_2021_CLASS.dat
      start_large_k_at_tau_h_over_tau_k: 0.05
      start_small_k_at_tau_c_over_tau_h: 0.0004
      start_sources_at_tau_c_over_tau_h: 0.006
      tight_coupling_trigger_tau_c_over_tau_h: 0.005
      tight_coupling_trigger_tau_c_over_tau_k: 0.008
      tol_ncdm_synchronous: 1.0e-06
      transfer_neglect_delta_k_S_e: 0.17
      transfer_neglect_delta_k_S_t0: 0.17
      transfer_neglect_delta_k_S_t1: 0.05
      transfer_neglect_delta_k_S_t2: 0.17
      ur_fluid_approximation: 2
      ur_fluid_trigger_tau_over_tau_k: 130.0

### varied, fixed, and derived parameters:
params:
  ln_A_s_1e10:
    prior:
      min: 2
      max: 4
    ref:
      dist: norm
      loc: 3.05
      scale: 0.001
    proposal: 0.0003
    latex: \log(10^{10} A_\mathrm{s})
  A_s:
    value: 'lambda ln_A_s_1e10: 1e-10*np.exp(ln_A_s_1e10)'
    latex: A_\mathrm{s}
    derived: true
  n_s:
    prior:
      min: 0.8
      max: 1.2
    ref:
      dist: norm
      loc: 0.965
      scale: 0.002
    proposal: 0.0002
    latex: n_\mathrm{s}
  tau_reio:
    prior:
      dist: norm
      loc: 0.054
      scale: 0.005
    ref:
      dist: norm
      loc: 0.054
      scale: 0.006
    proposal: 0.0002
    latex: \tau
  omega_b:
    prior:
      min: 0.005
      max: 0.1
    ref:
      dist: norm
      loc: 0.0224
      scale: 5.0e-05
    proposal: 9.7e-06
    latex: \Omega_\mathrm{b} h^2
  omega_cdm:
    prior:
      min: 0.001
      max: 0.99
    ref:
      dist: norm
      loc: 0.12
      scale: 0.0005
    proposal: 2.1e-05
    latex: \Omega_\mathrm{c} h^2
  H0:
    min: 20
    max: 100
    latex: H_0
  theta_s_100:
    prior:
      min: 0.5
      max: 10
    ref:
      dist: norm
      loc: 1.04165
      scale: 0.0004
    proposal: 5.0e-05
    latex: 100\theta_\mathrm{s}
  N_eff:
    prior:
      min: 0.05
      max: 10
    ref:
      dist: norm
      loc: 3.044
      scale: 0.005
    proposal: 0.0013
    latex: N_\mathrm{eff}
    drop: true
  N_ur:
    value: 'lambda N_eff: N_eff - 3*1.0131966'
    latex: N_\mathrm{ur}
    derived: false
  mnu:
    prior:
      min: 0
      max: 5
    ref:
      dist: norm
      loc: 0.06
      scale: 0.01
    proposal: 0.0014
    latex: \sum m_\nu
    drop: true
  m_ncdm:
    value: 'lambda mnu: str(mnu/3.) + "," + str(mnu/3.) + "," + str(mnu/3.)'
    latex: m_\nu
    derived: false
  ## To vary the HMcode2020 baryonic feedback parameter,
  ## set `baryonic_feedback: true` in the `hdlike.hdlike.HDLike` block,
  ##  un-comment the `log10T_heat_hmcode` block here, and
  ##  set `hmcode_version: 2020_baryonic_feedback` in the `theory` block below.
  #log10T_heat_hmcode:
  #  prior:
  #    dist: norm
  #    loc: 7.8
  #    scale: 0.00468
  #  ref:
  #    dist: norm
  #    loc: 7.8
  #    scale: 0.03
  #  proposal: 0.006
  #  latex: \log_{10}(T_\mathrm{AGN}/\mathrm{K})
  sigma8:
    latex: \sigma_8

### The MCMC sampler:
sampler:
  mcmc:
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2
    max_tries: 400d
    ## Below, you can provide (the absolute path to) a parameter covariance
    ##  matrix, e.g. from a previous MCMC run; see the Cobaya documentation for
    ##  more information.
    #covmat: hdlike/data/proposal_cov/from_chains/hd_lensed_desi_bao_class_lcdm_nrun_nnu_mnu.txt
