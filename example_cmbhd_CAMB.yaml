### Example Cobaya input file for CMB-HD with CAMB
# NOTE: if you would like to modify these settings, please create a copy of this file to use.


## NOTE: indicate where the products will be written and a prefix for their name
##  see https://cobaya.readthedocs.io/en/latest/output.html#output-shell
output: hdlike_chains/cmbhd

## this will automatically resume previously-run MCMC chains with the same
##  `output` path that you've provided above
resume: true

### Likelihood settings:
likelihood:
  hdlike.hdlike.HDLike:
    ## see `hdlike/HDLike.yaml` for a description of all settings
    delensed: true
    baryonic_feedback: false
  ## To include DESI BAO data, un-comment the `bao.generic` block below.
  ## NOTE that you must provide the *absolute* path to the
  ##      `measurements_file` and `cov_file` below. Here, they are given
  ##      by their paths relative to the location of `example_cmbhd.yaml`.
  ##      Note that in the test python script `test_hdlike_cobaya.py`,
  ##      the absolute paths are found and passed to Cobaya.
  #bao.generic:
  #  measurements_file: hdlike/data/mock_desi_bao_rs_over_DV_data.txt
  #  cov_file: hdlike/data/mock_desi_bao_rs_over_DV_cov.txt

### CAMB settings:
theory:
  camb:
    extra_args:
      AccuracyBoost: 1.1
      DoLateRadTruncation: false
      NonLinear: NonLinear_both
      bbn_predictor: PRIMAT_Yp_DH_ErrorMC_2021.dat
      ## NOTE: If `baryonic_feedback` is `True` in the `hdlike.hdlike.HDLike`
      ##       block above, set `halofit_version: mead2020_feedback`.
      halofit_version: mead2016
      k_per_logint: 130
      kmax: 100
      lAccuracyBoost: 3.0
      lSampleBoost: 3.0
      # NOTE: the parameter below is named `lens_margin` in CAMB versions
      #       before 2.0.0
      lens_output_margin: 2050
      lens_potential_accuracy: 30
      lmax: 24500
      min_l_logl_sampling: 10000
      num_massive_neutrinos: 3
      recombination_model: Recfast
      theta_H0_range:
      - 20
      - 100

### varied, fixed, and derived parameters:
params:
  logA:
    prior:
      min: 2
      max: 4
    ref:
      dist: norm
      loc: 3.05
      scale: 0.001
    proposal: 0.0003
    latex: \log(10^{10} A_\mathrm{s})
  As:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
    derived: true
  ns:
    prior:
      min: 0.8
      max: 1.2
    ref:
      dist: norm
      loc: 0.965
      scale: 0.002
    proposal: 0.0002
    latex: n_\mathrm{s}
  tau:
    prior:
      dist: norm
      loc: 0.054
      scale: 0.005
    ref:
      dist: norm
      loc: 0.054
      scale: 0.006
    proposal: 0.0002
    latex: \tau
  ombh2:
    prior:
      min: 0.005
      max: 0.1
    ref:
      dist: norm
      loc: 0.0224
      scale: 5.0e-05
    proposal: 9.7e-06
    latex: \Omega_\mathrm{b} h^2
  omch2:
    prior:
      min: 0.001
      max: 0.99
    ref:
      dist: norm
      loc: 0.12
      scale: 0.0005
    proposal: 2.1e-05
    latex: \Omega_\mathrm{c} h^2
  H0:
    min: 20
    max: 100
    latex: H_0
  theta_MC_100:
    prior:
      min: 0.5
      max: 10
    ref:
      dist: norm
      loc: 1.04071
      scale: 0.0004
    proposal: 5.0e-05
    latex: 100\theta_\mathrm{MC}
    drop: true
    renames: theta
  cosmomc_theta:
    value: 'lambda theta_MC_100: 1.e-2*theta_MC_100'
    derived: false
  nnu:
    prior:
      min: 0.05
      max: 10
    ref:
      dist: norm
      loc: 3.044
      scale: 0.005
    proposal: 0.0013
    latex: N_\mathrm{eff}
  mnu:
    prior:
      min: 0
      max: 5
    ref:
      dist: norm
      loc: 0.06
      scale: 0.01
    proposal: 0.0014
    latex: \sum m_\nu
  ## To vary the HMcode2020 baryonic feedback parameter, 
  ## set `baryonic_feedback: true` in the `hdlike.hdlike.HDLike` block,
  ##  un-comment the `HMCode_logT_AGN` block here, and
  ##  set `halofit_version: mead2020_feedback` in the `theory` block below.
  #HMCode_logT_AGN:
  #  prior:
  #    dist: norm
  #    loc: 7.8
  #    scale: 0.00468
  #  ref:
  #    dist: norm
  #    loc: 7.8
  #    scale: 0.03
  #  proposal: 0.006
  #  latex: \log_{10}(T_\mathrm{AGN}/\mathrm{K})
  sigma8:
    latex: \sigma_8

### The MCMC sampler:
sampler:
  mcmc:
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2
    ## Below, you can provide (the absolute path to) a parameter covariance
    ##  matrix, e.g. from a previous MCMC run; see the Cobaya documentation for
    ##  more information.
    #covmat: hdlike/data/proposal_cov/from_chains/hd_delensed_desi_bao_lcdm_nnu_mnu.txt
    ## Or, if you're using a model with baryonic feedback,
    #covmat: hdlike/data/proposal_cov/from_chains/hd_delensed_lcdm_nnu_mnu_bao_hmcode2020_feedback.txt
